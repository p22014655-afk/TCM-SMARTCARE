<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCM Smartcare+ | Change Password</title>
    <link rel="stylesheet" href="createaccount.css">
    <link rel="stylesheet" href="forgotpassword.css">
</head>
<body>
    <main class="register-page">
        <a class="brand" href="login.html">TCM SMARTCARE<span>+</span></a>

        <section class="register-card reset-card" aria-labelledby="resetTitle">
            <div class="register-heading">
                <p class="eyebrow">ACCOUNT SECURITY</p>
                <h1 id="resetTitle">Reset your password</h1>
                <p>Verify your account with your current password, then choose a new one.</p>
            </div>

            <form id="resetForm" novalidate>
                <label class="field" for="resetEmail">
                    Account email
                    <input
                        id="resetEmail"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="name@example.com"
                        required>
                    <span class="field-error" id="resetEmailError"></span>
                </label>

                <label class="field" for="currentPassword">
                    Current password
                    <input
                        id="currentPassword"
                        name="currentPassword"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your current password"
                        required>
                    <span class="field-error" id="currentPasswordError"></span>
                </label>

                <label class="field" for="newPassword">
                    New password
                    <input
                        id="newPassword"
                        name="newPassword"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        placeholder="At least 8 characters"
                        required>
                    <span class="field-error" id="newPasswordError"></span>
                </label>

                <label class="field" for="confirmPassword">
                    Confirm new password
                    <input
                        id="confirmPassword"
                        name="confirmPassword"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        placeholder="Enter your new password again"
                        required>
                    <span class="field-error" id="confirmPasswordError"></span>
                </label>

                <button class="create-button" id="resetButton" type="submit">
                    Reset password
                </button>

                <p class="form-status" id="resetStatus" role="status" aria-live="polite"></p>

                <p class="login-prompt">
                    <a href="login.html">Back to login</a>
                </p>
            </form>
        </section>

        <p class="privacy-note">
            This browser demo updates the password saved on this device.
        </p>
    </main>

    <script src="auth.js"></script>
    <script src="forgotpassword.js"></script>
</body>
</html>
