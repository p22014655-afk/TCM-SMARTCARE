<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCM SmartCare+ | Appointment Management</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body data-page="appointments" data-title="Appointments">
    <div class="admin-shell">
        <aside class="admin-sidebar">
            <a class="admin-logo" href="admin-dashboard.html"><span class="brand-mark">TCM</span><span>TCM SmartCare</span><b>+</b></a>
            <p class="portal-label">CLINIC MANAGEMENT</p>
            <nav class="admin-nav" aria-label="Admin navigation">
                <div class="nav-group"><p>Clinic Operations</p>
                    <a data-nav-page="dashboard" href="admin-dashboard.html"><span class="nav-icon icon-grid"></span><span>Dashboard</span></a>
                    <a data-nav-page="appointments" href="admin-appointments.html"><span class="nav-icon icon-calendar"></span><span>Appointments</span><i></i></a>
                    <a data-nav-page="schedule" data-staff-only href="admin-schedule.html"><span class="nav-icon icon-clock"></span><span>Doctor Schedule</span></a>
                    <a data-nav-page="patients" href="admin-patients.html"><span class="nav-icon icon-users"></span><span>Patients</span></a>
                    <a data-nav-page="carePlan" href="admin-care-plan.html"><span class="nav-icon icon-clipboard"></span><span>Clinical Notes</span></a>
                </div>
                <div class="nav-group"><p>Store</p><a data-nav-page="products" data-staff-only href="admin-products.html"><span class="nav-icon icon-box"></span><span>Products</span></a><a data-nav-page="orders" data-staff-only href="admin-orders.html"><span class="nav-icon icon-bag"></span><span>Orders</span></a></div>
                <div class="nav-group"><p>Communication</p><a data-nav-page="messages" href="admin-messages.html"><span class="nav-icon icon-message"></span><span>Messages</span></a><a data-nav-page="feedback" data-staff-only href="admin-feedback.html"><span class="nav-icon icon-feedback"></span><span>Feedback</span></a><a data-nav-page="announcements" data-staff-only href="admin-announcements.html"><span class="nav-icon icon-megaphone"></span><span>Announcements</span></a></div>
                <div class="nav-group"><p>Insights</p><a data-nav-page="analytics" data-staff-only href="admin-analytics.html"><span class="nav-icon icon-chart"></span><span>Analytics</span></a></div>
            </nav>
            <div class="sidebar-spacer"></div><div class="workspace-card"><strong>Staff workspace</strong><span>Care starts with a connected team.</span></div>
        </aside>
        <main class="admin-main"><header class="admin-header"><div class="admin-title"><p id="adminDate"></p><h1 id="pageTitle"></h1></div><div class="admin-actions"><span class="notification-dot" aria-label="Notifications"></span><div class="admin-profile"><div class="avatar" id="adminAvatar"></div><span><strong id="adminName"></strong><small id="adminRole"></small></span></div><button class="ghost-btn" id="adminLogout" type="button">Logout</button></div></header><section class="admin-page" id="adminPage"></section></main>
    </div>
    <template id="admin-appointment-view">
        <div class="page-hero">
            <div><h2>Keep every visit on track</h2><p>Manage bookings, arrival status and appointment details in one place.</p></div>
            <button class="primary-btn" id="createAppointment" type="button"><span class="btn-icon icon-plus"></span>Create Appointment</button>
        </div>
        <div class="panel appointment-panel">
            <div class="panel-header">
                <div><h2>Appointments</h2><p id="appointmentResultSummary"></p></div>
                <div class="segmented"><button class="secondary-btn" id="calendarView" type="button">Calendar View</button><button class="primary-btn" id="tableView" type="button">Table View</button></div>
            </div>
            <div class="appointment-tabs">
                <button class="active" type="button" data-status-tab="">All appointments <span id="allAppointmentCount"></span></button>
                <button type="button" data-status-tab="Scheduled">Scheduled <span id="scheduledAppointmentCount"></span></button>
                <button type="button" data-status-tab="Checked In">Checked In <span id="checkedInAppointmentCount"></span></button>
                <button type="button" data-status-tab="Completed">Completed <span id="completedAppointmentCount"></span></button>
            </div>
            <div class="table-toolbar">
                <label class="toolbar-search"><span>Search patient or appointment ID</span><input id="appointmentSearch" placeholder="e.g. patient name, phone or appointment ID"></label>
                <label><span>Appointment date</span><select id="filterDate"><option value="upcoming">Upcoming · 30 days</option><option value="today">Today</option><option value="tomorrow">Tomorrow</option><option value="next7">Next 7 days</option><option value="week">This week</option><option value="next30">Next 30 days</option><option value="custom">Choose a date…</option><option value="past">Past appointments</option><option value="">All dates</option></select></label>
                <label class="custom-date-filter" id="customDateFilter" hidden><span>Choose date</span><input id="filterCustomDate" type="date" aria-label="Choose appointment date"></label>
                <label><select id="filterDoctor"></select></label>
                <label><select id="filterService"><option value="">All Services</option><option>TCM Consultation</option><option>Acupuncture</option><option>Cupping</option><option>Herbal Medicine</option></select></label>
                <label><select id="filterStatus"><option value="">All</option><option>Scheduled</option><option>Checked In</option><option>In Consultation</option><option>Completed</option><option>Cancelled</option><option>Rescheduled</option></select></label>
            </div>
            <div id="appointmentContent"></div>
        </div>
        <div class="appointment-summary-grid">
            <section class="selected-appointment" id="selectedAppointment"></section>
            <aside class="panel manage-card"><h2>Manage this appointment</h2><p>Select a record to review its details and available actions.</p></aside>
        </div>
    </template>
    <script src="admin-data.js"></script>
    <script src="admin-utils.js"></script>
    <script src="admin-auth.js"></script>
    <script src="admin-app.js"></script>
</body>
</html>
