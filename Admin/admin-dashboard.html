<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCM SmartCare+ | Admin Dashboard</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body data-page="dashboard" data-title="Management Dashboard">
    <div class="admin-shell">
        <aside class="admin-sidebar">
            <a class="admin-logo" href="admin-dashboard.html"><span class="brand-mark">TCM</span><span>TCM SmartCare</span><b>+</b></a>
            <p class="portal-label">CLINIC MANAGEMENT</p>
            <nav class="admin-nav" aria-label="Admin navigation">
                <div class="nav-group"><p>Clinic Operations</p>
                    <a data-nav-page="dashboard" href="admin-dashboard.html"><span class="nav-icon icon-grid"></span><span>Dashboard</span><i></i></a>
                    <a data-nav-page="appointments" href="admin-appointments.html"><span class="nav-icon icon-calendar"></span><span>Appointments</span></a>
                    <a data-nav-page="schedule" data-staff-only href="admin-schedule.html"><span class="nav-icon icon-clock"></span><span>Doctor Schedule</span></a>
                    <a data-nav-page="patients" href="admin-patients.html"><span class="nav-icon icon-users"></span><span>Patients</span></a>
                    <a data-nav-page="carePlan" href="admin-care-plan.html"><span class="nav-icon icon-clipboard"></span><span>Clinical Notes</span></a>
                </div>
                <div class="nav-group"><p>Store</p>
                    <a data-nav-page="products" data-staff-only href="admin-products.html"><span class="nav-icon icon-box"></span><span>Products</span></a>
                    <a data-nav-page="orders" data-staff-only href="admin-orders.html"><span class="nav-icon icon-bag"></span><span>Orders</span></a>
                </div>
                <div class="nav-group"><p>Communication</p>
                    <a data-nav-page="messages" href="admin-messages.html"><span class="nav-icon icon-message"></span><span>Messages</span></a>
                    <a data-nav-page="feedback" data-staff-only href="admin-feedback.html"><span class="nav-icon icon-feedback"></span><span>Feedback</span></a>
                    <a data-nav-page="announcements" data-staff-only href="admin-announcements.html"><span class="nav-icon icon-megaphone"></span><span>Announcements</span></a>
                </div>
                <div class="nav-group"><p>Insights</p>
                    <a data-nav-page="analytics" data-staff-only href="admin-analytics.html"><span class="nav-icon icon-chart"></span><span>Analytics</span></a>
                </div>
            </nav>
            <div class="sidebar-spacer"></div>
            <div class="workspace-card"><strong>Staff workspace</strong><span>Care starts with a connected team.</span></div>
        </aside>
        <main class="admin-main">
            <header class="admin-header">
                <div class="admin-title"><p id="adminDate"></p><h1 id="pageTitle"></h1></div>
                <div class="admin-actions">
                    <span class="notification-dot" aria-label="Notifications"></span>
                    <div class="admin-profile"><div class="avatar" id="adminAvatar"></div><span><strong id="adminName"></strong><small id="adminRole"></small></span></div>
                    <button class="ghost-btn" id="adminLogout" type="button">Logout</button>
                </div>
            </header>
            <section class="admin-page" id="adminPage"></section>
        </main>
    </div>
    <template id="admin-staff-dashboard-view">
        <div class="page-hero"><div><h2 id="staffDashboardGreeting"></h2><p>Your clinic at a glance. Keep today's care moving smoothly.</p></div><button class="primary-btn" id="dashboardCreateAppointment" type="button"><span class="btn-icon icon-plus"></span>New Appointment</button></div>
        <div class="kpi-grid" id="staffDashboardKpis"></div>
        <div class="dashboard-layout">
            <section class="panel">
                <div class="panel-header"><div><h2>Today's Appointments</h2><p id="staffAppointmentSummary"></p></div><a class="secondary-btn" href="admin-appointments.html">View all</a></div>
                <div id="staffAppointmentTable"></div>
                <p class="table-note"><span class="nav-icon icon-users"></span> Patient queue - Jamie Lee is waiting for TCM Consultation.</p>
            </section>
            <aside class="dashboard-side">
                <section class="panel"><h2>Needs your attention</h2><p>Alerts to keep the clinic on track</p>
                    <div class="alert-list">
                        <a class="alert-card alert-red" href="admin-products.html?stock=low"><span class="nav-icon icon-alert"></span><strong>Ginseng stock is below 5 units.</strong><small>Review inventory</small></a>
                        <a class="alert-card alert-gold" href="admin-appointments.html?date=upcoming"><span class="nav-icon icon-clipboard"></span><strong>Appointments are booked automatically.</strong><small>Check patients in when they arrive</small></a>
                        <a class="alert-card alert-green" href="admin-orders.html?status=Pending%20Packing"><span class="nav-icon icon-box"></span><strong>2 orders are waiting for packing.</strong><small>Process orders</small></a>
                    </div>
                </section>
                <section class="quick-panel"><h2>Quick Actions</h2><div class="quick-grid">
                    <a class="quick-action" href="admin-products.html?action=create"><span class="nav-icon icon-box"></span>Add Product</a>
                    <a class="quick-action" href="admin-orders.html"><span class="nav-icon icon-bag"></span>View Orders</a>
                    <a class="quick-action wide" href="admin-schedule.html"><span class="nav-icon icon-clock"></span>Manage Schedule</a>
                </div></section>
            </aside>
        </div>
        <section class="timeline-band"><div class="panel-header"><div><h2>Today's care timeline</h2><p>Scheduled appointment times - Tuesday, 6 October</p></div></div><div class="timeline-row" id="staffTimeline"></div></section>
    </template>
    <template id="admin-doctor-dashboard-view">
        <h2 id="doctorDashboardGreeting"></h2>
        <div class="kpi-grid" id="doctorDashboardKpis"></div>
        <div class="dashboard-layout">
            <section class="panel"><div class="panel-header"><h2>Today's Schedule</h2><a class="secondary-btn" href="admin-appointments.html">Open schedule</a></div><div id="doctorAppointmentTable"></div></section>
            <aside class="panel">
                <h2>Patient Alerts</h2>
                <div class="alert-list"><a class="alert-card" href="admin-care-plan.html?appointment=APT-001">Pre-consultation submitted<br><strong>Jamie Lee</strong><br>Appointment: 10:00 AM</a></div>
                <h2 style="margin-top:22px">Quick Actions</h2>
                <div class="quick-grid">
                    <a class="quick-action" href="admin-appointments.html">Today's Appointments</a>
                    <a class="quick-action" href="admin-patients.html">My Patients</a>
                    <a class="quick-action" href="admin-care-plan.html">Pre-Consultation</a>
                    <a class="quick-action" href="admin-messages.html">Messages</a>
                </div>
            </aside>
        </div>
    </template>
    <script src="admin-data.js"></script>
    <script src="admin-utils.js"></script>
    <script src="admin-auth.js"></script>
    <script src="admin-app.js"></script>
</body>
</html>
