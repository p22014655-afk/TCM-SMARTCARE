<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCM SmartCare+ | Doctor Schedule</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body data-page="schedule" data-title="Doctor Schedule Management">
    <div class="admin-shell">
        <aside class="admin-sidebar">
            <a class="admin-logo" href="admin-dashboard.html"><span class="brand-mark">TCM</span><span>TCM SmartCare</span><b>+</b></a><p class="portal-label">CLINIC MANAGEMENT</p>
            <nav class="admin-nav" aria-label="Admin navigation">
                <div class="nav-group"><p>Clinic Operations</p><a data-nav-page="dashboard" href="admin-dashboard.html"><span class="nav-icon icon-grid"></span><span>Dashboard</span></a><a data-nav-page="appointments" href="admin-appointments.html"><span class="nav-icon icon-calendar"></span><span>Appointments</span></a><a data-nav-page="schedule" data-staff-only href="admin-schedule.html"><span class="nav-icon icon-clock"></span><span>Doctor Schedule</span><i></i></a><a data-nav-page="patients" href="admin-patients.html"><span class="nav-icon icon-users"></span><span>Patients</span></a><a data-nav-page="carePlan" href="admin-care-plan.html"><span class="nav-icon icon-clipboard"></span><span>Clinical Notes</span></a></div>
                <div class="nav-group"><p>Store</p><a data-nav-page="products" data-staff-only href="admin-products.html"><span class="nav-icon icon-box"></span><span>Products</span></a><a data-nav-page="orders" data-staff-only href="admin-orders.html"><span class="nav-icon icon-bag"></span><span>Orders</span></a></div>
                <div class="nav-group"><p>Communication</p><a data-nav-page="messages" href="admin-messages.html"><span class="nav-icon icon-message"></span><span>Messages</span></a><a data-nav-page="feedback" data-staff-only href="admin-feedback.html"><span class="nav-icon icon-feedback"></span><span>Feedback</span></a><a data-nav-page="announcements" data-staff-only href="admin-announcements.html"><span class="nav-icon icon-megaphone"></span><span>Announcements</span></a></div>
                <div class="nav-group"><p>Insights</p><a data-nav-page="analytics" data-staff-only href="admin-analytics.html"><span class="nav-icon icon-chart"></span><span>Analytics</span></a></div>
            </nav><div class="sidebar-spacer"></div><div class="workspace-card"><strong>Staff workspace</strong><span>Care starts with a connected team.</span></div>
        </aside>
        <main class="admin-main"><header class="admin-header"><div class="admin-title"><p id="adminDate"></p><h1 id="pageTitle"></h1></div><div class="admin-actions"><span class="notification-dot" aria-label="Notifications"></span><div class="admin-profile"><div class="avatar" id="adminAvatar"></div><span><strong id="adminName"></strong><small id="adminRole"></small></span></div><button class="ghost-btn" id="adminLogout" type="button">Logout</button></div></header><section class="admin-page" id="adminPage"></section></main>
    </div>
    <template id="admin-schedule-view">
        <section class="schedule-doctor-bar">
            <div class="person-cell"><span class="avatar mini-avatar" id="scheduleDoctorAvatar"></span><span><small>Manage availability for</small><strong id="scheduleDoctorName"></strong></span></div>
            <select id="scheduleDoctor" aria-label="Select doctor schedule"></select>
            <span class="badge active">Weekly recurring</span><span class="muted-text">Mon - Wed - Fri</span>
        </section>
        <div class="info-strip"><span class="nav-icon icon-alert"></span> Set the doctor's recurring availability and date exceptions. This calendar shows working hours, not booked appointments.</div>
        <div class="schedule-layout">
            <section class="panel schedule-calendar-panel">
                <div class="panel-header"><div><h2>5-11 October 2026</h2><p>Weekly availability</p></div><div class="row-actions"><button class="mini-btn" type="button">Today</button><button class="mini-btn" type="button" aria-label="Previous week">‹</button><button class="mini-btn" type="button" aria-label="Next week">›</button></div></div>
                <div class="schedule-legend"><span></span> Morning availability <span></span> Afternoon availability <span></span> Not available</div>
                <div id="scheduleCalendar"></div>
                <div class="schedule-note"><span class="nav-icon icon-clock"></span><strong>30-minute slots - 1 patient per slot</strong><small>12:00-14:00 is a break. Unselected weekdays remain unavailable.</small></div>
            </section>
            <aside class="panel schedule-form-panel"><h2>Working hours</h2><p>Recurring weekly schedule</p><form class="form-grid compact-form" id="scheduleForm"></form></aside>
        </div>
        <section class="save-bar" id="scheduleSaveBar"></section>
    </template>
    <script src="admin-data.js"></script>
    <script src="admin-utils.js"></script>
    <script src="admin-auth.js"></script>
    <script src="admin-app.js"></script>
</body>
</html>
